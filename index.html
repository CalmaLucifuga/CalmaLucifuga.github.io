<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONGRESO — Archivo y Evidencia Histórica</title>

    <!-- Google Fonts: Raleway (Pesos 300, 700 y 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;700;900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-DTPiziYW.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DnsI6SkB.css">
  </head>
  <body>

    <!-- 1. ESCENARIO DE FONDO ARTÍSTICO (Viento, humo denso, chispas) -->
    <div id="escenario-artistico" aria-hidden="true"></div>

    <!-- 2. CABECERA EDITORIAL BLANCA (Estilo 3 Columnas) -->
    <header id="cabecera-principal" class="cabecera-blanca-editorial vista-oculta">
      <div class="fila-cabecera-tres-columnas">
        
        <!-- Izquierda: Navegación de funciones -->
        <nav class="nav-izquierda-funciones">
          <button id="btn-volver-home" class="link-nav-cabecera activo">ARCHIVO</button>
          <button id="btn-explorador" class="link-nav-cabecera">DOCUMENTOS</button>
          <button id="btn-pizarra" class="link-nav-cabecera">PIZARRA</button>
        </nav>

        <!-- Centro: Logotipo de marca "CONGRESO" -->
        <div class="logo-centro-cabecera">
          <span id="logo-nav-congreso" class="logo-congreso-marca" role="button" tabindex="0" title="Volver a Portada">
            CONGRESO
          </span>
        </div>

        <!-- Derecha: Buscador integrado in situ -->
        <div class="utilidad-derecha-buscador">
          <div class="caja-input-busqueda">
            <span class="icono-lupa-cabecera">🔍</span>
            <input 
              type="search" 
              id="input-buscador-cabecera" 
              placeholder="BUSCAR DOCUMENTOS..." 
              autocomplete="off"
            />
          </div>

          <!-- Desplegable con resultados de búsqueda en vivo -->
          <div id="dropdown-resultados-cabecera" class="resultados-busqueda-flotante vista-oculta"></div>
        </div>

      </div>
    </header>

    <!-- 3. DOMINIO EDITORIAL: 3 Círculos Anónimos Flotantes -->
    <nav id="nav-nodos-home" class="nav-nodos-home vista-oculta" aria-label="Navegación del Tríptico">
      <button id="nodo-portada" class="nodo-circulo activo" title="Acto 1: Portada" aria-label="Portada"></button>
      <button id="nodo-actualidad" class="nodo-circulo" title="Acto 2: Actualidad" aria-label="Actualidad"></button>
      <button id="nodo-inicio" class="nodo-circulo" title="Acto 3: Despacho" aria-label="Despacho"></button>
    </nav>

    <!-- 4. CONTENEDOR PRINCIPAL DE TODAS LAS VISTAS -->
    <main>

      <!-- ACTO 1: Portada Monumental Limpia -->
      <div id="vista-portada">
        <section class="pantalla-portada">
          
          <div class="portada-emblema-wrapper">
            <span class="emblema-punto"></span>
            <span class="subtexto-institucional">REGISTRO & EVIDENCIA DOCUMENTAL</span>
          </div>

          <h1 
            id="titulo-portada-trigger" 
            class="titulo-monumental-portada" 
            role="button" 
            tabindex="0" 
            title="Haz clic para continuar"
          >
            CONGRESO
          </h1>

          <div class="indicador-ingreso">
            <span class="texto-ingreso">[ HAZ CLIC PARA CONTINUAR ]</span>
            <span class="flecha-ingreso">→</span>
          </div>

        </section>
      </div>

      <!-- ACTO 2: Actualidad (Crónica Histórica a la izquierda con Fondo Negro) -->
      <div id="vista-actualidad" class="vista-oculta"></div>

      <!-- ESCENA INTERSTICIAL: Cinemática de Traspaso (1990) -->
      <div id="vista-cinematica" class="vista-oculta"></div>

      <!-- ACTO 3: Despacho Lookbook (Díptico 50/50 borde a borde) -->
      <div id="vista-inicio" class="vista-oculta"></div>

      <!-- HERRAMIENTA OPERATIVA: Buscador Individual Completo -->
      <div id="vista-explorador" class="vista-oculta">
        <section class="barra-filtros">
          <input 
            type="search" 
            id="buscador" 
            placeholder="Buscar por título, tema, tag..."
            autocomplete="off"
          />
          <select id="filtro-categoria">
            <option value="todas">Todas las categorías</option>
          </select>
        </section>

        <p id="contador-resultados" class="contador"></p>
        <section id="contenedor-datos" class="grid-datos"></section>
      </div>

      <!-- HERRAMIENTA OPERATIVA: Pizarra de Análisis Comparativo -->
      <div id="vista-pizarra" class="vista-oculta">
        <div class="contenedor-pizarra">

          <aside class="panel-lateral-pizarra">
            <h3>Archivos Disponibles</h3>
            <p class="subtexto-pizarra">Arrastra los que quieras analizar:</p>
            <div id="lista-arrastrables" class="lista-arrastrables"></div>
          </aside>

          <section class="area-trabajo">
            <div class="cabecera-area">
              <div class="herramientas-mesa">
                <button id="btn-toggle-panel" class="btn-secundario" title="Ocultar/Mostrar lista lateral">
                  ◀ Ocultar Panel
                </button>

                <div class="grupo-split">
                  <button class="btn-split activo" data-layout="horizontal" title="Vista en columnas paralelas">
                    ⬌ Columnas
                  </button>
                  <button class="btn-split" data-layout="vertical" title="Vista en filas apiladas">
                    ⬍ Filas
                  </button>
                  <button class="btn-split" data-layout="grid" title="Vista en cuadrícula 2x2">
                    ⊞ Grid
                  </button>
                </div>

                <button id="btn-pantalla-completa" class="btn-secundario" title="Modo Pantalla Completa">
                  ⛶
                </button>
              </div>

              <button id="btn-limpiar-pizarra" class="btn-secundario">Limpiar Mesa</button>
            </div>

            <div id="zona-suelta" class="zona-suelta" data-layout="horizontal">
              <div class="mensaje-zona-vacia">
                <span class="icono-drop">📥</span>
                <p>Arrastra y suelta documentos aquí para compararlos</p>
              </div>
            </div>

            <div id="panel-metricas" class="panel-metricas vista-oculta"></div>
          </section>

        </div>
      </div>

    </main>

    <!-- Script orquestador principal -->
  </body>
</html>
